<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply the saved theme before any CSS or React renders so the
         page doesn't flash light theme on every reload. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('highhype-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
